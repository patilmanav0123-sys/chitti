<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHITTI HUD</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Share Tech Mono', monospace;
        }

        body {
            background-color: #00040a;
            color: #00ffff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .hud-top {
            position: absolute;
            top: 20px;
            width: 95%;
            display: flex;
            justify-content: space-between;
            border-top: 2px solid #ff0055;
            padding-top: 10px;
        }

        .hud-text {
            font-size: 0.9rem;
            color: #ff0055;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 5px #ff0055;
        }

        .core-container {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
        }

        .core-ring-1, .core-ring-2, .core-ring-3 {
            position: absolute;
            border-radius: 50%;
            border: 2px solid transparent;
        }

        .core-ring-1 {
            width: 280px;
            height: 280px;
            border-top: 2px solid #00ffff;
            border-bottom: 2px solid #00ffff;
            animation: spin 8s linear infinite;
        }

        .core-ring-2 {
            width: 240px;
            height: 240px;
            border-left: 2px solid #ff0055;
            border-right: 2px solid #ff0055;
            animation: spin 4s linear infinite reverse;
        }

        .core-ring-3 {
            width: 200px;
            height: 200px;
            border: 1px dashed #00ffff;
            animation: spin 15s linear infinite;
        }

        .core-center {
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, #00ffff 10%, transparent 70%);
            border-radius: 50%;
            box-shadow: 0 0 40px #00ffff;
            transition: all 0.2s ease-in-out;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1rem;
            color: #fff;
            font-weight: bold;
            text-shadow: 0 0 5px #000;
        }

        .listening .core-center {
            background: radial-gradient(circle, #ff0055 10%, transparent 70%);
            box-shadow: 0 0 60px #ff0055;
            transform: scale(1.1);
        }
        
        .thinking .core-center {
            background: radial-gradient(circle, #ffaa00 10%, transparent 70%);
            box-shadow: 0 0 60px #ffaa00;
            animation: pulse 1s infinite;
        }

        .speaking .core-center {
            background: radial-gradient(circle, #aa00ff 10%, transparent 70%);
            box-shadow: 0 0 60px #aa00ff;
            animation: pulse 0.5s infinite;
        }

        .terminal {
            width: 90%;
            max-width: 700px;
            height: 180px;
            background: rgba(0, 10, 20, 0.8);
            border: 1px solid #00ffff;
            border-left: 5px solid #ff0055;
            padding: 20px;
            overflow-y: auto;
            position: relative;
            box-shadow: inset 0 0 20px rgba(0, 255, 255, 0.1);
        }

        .terminal::before {
            content: "SYSTEM_LOG //";
            position: absolute;
            top: -10px;
            left: 10px;
            background: #00040a;
            padding: 0 5px;
            font-size: 0.8rem;
            color: #00ffff;
        }

        .log-entry {
            margin-bottom: 8px;
            font-size: 1rem;
            line-height: 1.4;
            color: #aaddff;
        }

        .log-user { color: #ff0055; }
        .log-ai { color: #00ffff; font-weight: bold; }
        .log-error { color: #ff3333; font-weight: bold; }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
        }

        button {
            background: transparent;
            border: 1px solid #00ffff;
            color: #00ffff;
            padding: 12px 30px;
            font-size: 1.1rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.2s;
            position: relative;
            overflow: hidden;
            font-weight: bold;
        }

        button:hover, button:active {
            background: #00ffff;
            color: #000;
            box-shadow: 0 0 15px #00ffff;
        }

        .reset-btn {
            border-color: #ff0055;
            color: #ff0055;
        }
        
        .reset-btn:hover, .reset-btn:active {
            background: #ff0055;
            box-shadow: 0 0 15px #ff0055;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div class="hud-top">
        <div class="hud-text">SYS.VER: CHITTI_OS_3.0</div>
        <div class="hud-text" id="status-text">STATUS: IDLE</div>
    </div>

    <div class="core-container" id="core">
        <div class="core-ring-1"></div>
        <div class="core-ring-2"></div>
        <div class="core-ring-3"></div>
        <div class="core-center" id="core-text">READY</div>
    </div>

    <div class="terminal" id="terminal-box">
        <div class="log-entry">> Voice engine initialized. Awaiting commands...</div>
    </div>

    <div class="controls">
        <button id="micBtn" onclick="toggleListening()">[ INITIATE UPLINK ]</button>
        <button class="reset-btn" onclick="resetApiKey()">[ RESET KEY ]</button>
    </div>

    <script>
        const systemInstruction = "You are Chitti, an elite AI assistant. Speak in short, highly intelligent, futuristic responses. You understand English, Hindi, and Marathi.";

        // Added .trim() to prevent invisible spaces from breaking the API key
        let API_KEY = localStorage.getItem('CHITTI_API_KEY')?.trim();
        if (!API_KEY) { askForKey(); }

        function askForKey() {
            let input = prompt("ENTER GEMINI API KEY TO AUTHENTICATE:");
            if (input) { 
                API_KEY = input.trim();
                localStorage.setItem('CHITTI_API_KEY', API_KEY); 
            }
        }

        function resetApiKey() {
            localStorage.removeItem('CHITTI_API_KEY');
            askForKey();
        }

        const coreEl = document.getElementById('core');
        const coreText = document.getElementById('core-text');
        const terminalBox = document.getElementById('terminal-box');
        const statusText = document.getElementById('status-text');
        
        let isListening = false;
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'en-IN';

        function logToTerminal(sender, message) {
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            if (sender === 'USER') {
                entry.innerHTML = `<span class="log-user">USER:</span> ${message}`;
            } else if (sender === 'CHITTI') {
                entry.innerHTML = `<span class="log-ai">CHITTI:</span> ${message}`;
            } else if (sender === 'SYS_ERR') {
                entry.innerHTML = `<span class="log-error">> SYS_ERROR: ${message}</span>`;
            } else {
                entry.innerHTML = `> ${message}`;
            }
            terminalBox.appendChild(entry);
            terminalBox.scrollTop = terminalBox.scrollHeight;
        }

        function setUIState(state) {
            coreEl.className = `core-container ${state}`;
            if(state === 'listening') {
                coreText.innerText = "REC";
                statusText.innerText = "STATUS: LISTENING";
            } else if (state === 'thinking') {
                coreText.innerText = "PRC";
                statusText.innerText = "STATUS: PROCESSING";
            } else if (state === 'speaking') {
                coreText.innerText = "OUT";
                statusText.innerText = "STATUS: TRANSMITTING";
            } else {
                coreText.innerText = "READY";
                statusText.innerText = "STATUS: IDLE";
            }
        }

        recognition.onstart = () => {
            isListening = true;
            setUIState('listening');
        };

        recognition.onresult = async (event) => {
            const userCommand = event.results[0][0].transcript;
            logToTerminal('USER', userCommand);
            await processWithChitti(userCommand);
        };

        recognition.onerror = () => {
            logToTerminal('SYS_ERR', "AUDIO INPUT ERROR.");
            setUIState('idle');
            isListening = false;
        };

        recognition.onend = () => {
            if (coreEl.classList.contains('listening')) {
                setUIState('idle');
                isListening = false;
            }
        };

        function toggleListening() {
            if (!API_KEY) { askForKey(); return; }
            if (!isListening) {
                window.speechSynthesis.cancel();
                recognition.start();
            } else {
                recognition.stop();
            }
        }

        async function processWithChitti(promptText) {
            setUIState('thinking');

            try {
                // The API key MUST be sent in the header, no longer in the URL
                const fetchUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent`;
                
                const response = await fetch(fetchUrl, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'x-goog-api-key': API_KEY
                    }, 
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptText }] }],
                        systemInstruction: { parts: [{ text: systemInstruction }] }
                    })
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData?.error?.message || `HTTP ${response.status} - Request Denied`);
                }

                const data = await response.json();
                const aiReply = data.candidates[0].content.parts[0].text;
                
                logToTerminal('CHITTI', aiReply);
                speakReply(aiReply);

            } catch (err) {
                // Now Chitti will print the exact server error out loud to the terminal!
                if(err.message === 'Failed to fetch') {
                    logToTerminal('SYS_ERR', "CORS or AdBlocker blocked the connection. Turn off Brave Shields/AdGuard.");
                } else {
                    logToTerminal('SYS_ERR', err.message);
                }
                setUIState('idle');
            }
        }

        function speakReply(text) {
            setUIState('speaking');
            const utterance = new SpeechSynthesisUtterance(text);
            const voices = window.speechSynthesis.getVoices();
            const preferredVoice = voices.find(v => v.lang.includes('hi') || v.lang.includes('IN')) || voices[0];
            if (preferredVoice) utterance.voice = preferredVoice;

            utterance.onend = () => {
                setUIState('idle');
            };
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
