<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHITTI HUD</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Share Tech Mono', monospace;
        }

        body {
            background-color: #00040a;
            color: #00ffff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .hud-top {
            position: absolute;
            top: 20px;
            width: 95%;
            display: flex;
            justify-content: space-between;
            border-top: 2px solid #ff0055;
            padding-top: 10px;
        }

        .hud-text {
            font-size: 0.9rem;
            color: #ff0055;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 5px #ff0055;
        }

        .core-container {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
        }

        .core-ring-1, .core-ring-2, .core-ring-3 {
            position: absolute;
            border-radius: 50%;
            border: 2px solid transparent;
        }

        .core-ring-1 {
            width: 280px;
            height: 280px;
            border-top: 2px solid #00ffff;
            border-bottom: 2px solid #00ffff;
            animation: spin 8s linear infinite;
        }

        .core-ring-2 {
            width: 240px;
            height: 240px;
            border-left: 2px solid #ff0055;
            border-right: 2px solid #ff0055;
            animation: spin 4s linear infinite reverse;
        }

        .core-ring-3 {
            width: 200px;
            height: 200px;
            border: 1px dashed #00ffff;
            animation: spin 15s linear infinite;
        }

        .core-center {
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, #00ffff 10%, transparent 70%);
            border-radius: 50%;
            box-shadow: 0 0 40px #00ffff;
            transition: all 0.2s ease-in-out;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1rem;
            color: #fff;
            font-weight: bold;
            text-shadow: 0 0 5px #000;
        }

        /* Passive mode colors (Waiting for Wake Word) */
        .passive .core-center {
            background: radial-gradient(circle, #0055ff 10%, transparent 70%);
            box-shadow: 0 0 20px #0055ff;
            opacity: 0.7;
        }

        .listening .core-center {
            background: radial-gradient(circle, #ff0055 10%, transparent 70%);
            box-shadow: 0 0 60px #ff0055;
            transform: scale(1.1);
        }
        
        .thinking .core-center {
            background: radial-gradient(circle, #ffaa00 10%, transparent 70%);
            box-shadow: 0 0 60px #ffaa00;
            animation: pulse 1s infinite;
        }

        .speaking .core-center {
            background: radial-gradient(circle, #aa00ff 10%, transparent 70%);
            box-shadow: 0 0 60px #aa00ff;
            animation: pulse 0.5s infinite;
        }

        .terminal {
            width: 90%;
            max-width: 700px;
            height: 180px;
            background: rgba(0, 10, 20, 0.8);
            border: 1px solid #00ffff;
            border-left: 5px solid #ff0055;
            padding: 20px;
            overflow-y: auto;
            position: relative;
            box-shadow: inset 0 0 20px rgba(0, 255, 255, 0.1);
        }

        .terminal::before {
            content: "SYSTEM_LOG //";
            position: absolute;
            top: -10px;
            left: 10px;
            background: #00040a;
            padding: 0 5px;
            font-size: 0.8rem;
            color: #00ffff;
        }

        .log-entry {
            margin-bottom: 8px;
            font-size: 1rem;
            line-height: 1.4;
            color: #aaddff;
        }

        .log-user { color: #ff0055; }
        .log-ai { color: #00ffff; font-weight: bold; }
        .log-error { color: #ff3333; font-weight: bold; }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
        }

        button {
            background: transparent;
            border: 1px solid #00ffff;
            color: #00ffff;
            padding: 12px 30px;
            font-size: 1.1rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.2s;
            position: relative;
            overflow: hidden;
            font-weight: bold;
        }

        button:hover, button:active {
            background: #00ffff;
            color: #000;
            box-shadow: 0 0 15px #00ffff;
        }

        .reset-btn {
            border-color: #ff0055;
            color: #ff0055;
        }
        
        .reset-btn:hover, .reset-btn:active {
            background: #ff0055;
            box-shadow: 0 0 15px #ff0055;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div class="hud-top">
        <div class="hud-text">SYS.VER: CHITTI_OS_4.0</div>
        <div class="hud-text" id="status-text">STATUS: RADAR OFFLINE</div>
    </div>

    <div class="core-container passive" id="core">
        <div class="core-ring-1"></div>
        <div class="core-ring-2"></div>
        <div class="core-ring-3"></div>
        <div class="core-center" id="core-text">SLP</div>
    </div>

    <div class="terminal" id="terminal-box">
        <div class="log-entry">> Voice engine loaded. Tap [ POWER ON RADAR ] to begin loop.</div>
    </div>

    <div class="controls">
        <button id="micBtn" onclick="startRadarLoop()">[ POWER ON RADAR ]</button>
        <button class="reset-btn" onclick="resetApiKey()">[ RESET KEY ]</button>
    </div>

    <script>
        const systemInstruction = "You are Chitti, an elite AI assistant. Speak in short, highly intelligent, natural responses. Do not use robotic language.";

        let API_KEY = localStorage.getItem('CHITTI_API_KEY')?.trim();
        if (!API_KEY) { askForKey(); }

        function askForKey() {
            let input = prompt("ENTER GEMINI API KEY TO AUTHENTICATE:");
            if (input) { 
                API_KEY = input.trim();
                localStorage.setItem('CHITTI_API_KEY', API_KEY); 
            }
        }

        function resetApiKey() {
            localStorage.removeItem('CHITTI_API_KEY');
            askForKey();
        }

        const coreEl = document.getElementById('core');
        const coreText = document.getElementById('core-text');
        const terminalBox = document.getElementById('terminal-box');
        const statusText = document.getElementById('status-text');
        
        // System States
        let isAwake = false;       // Determines if she heard her name yet
        let aiIsSpeaking = false;  // Prevents her from hearing her own voice
        let radarActive = false;   // Determines if the mic loop is running

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'en-IN';
        recognition.continuous = false; // We manually loop it so Android doesn't time out

        // 1. Force load voices immediately so they are ready
        window.speechSynthesis.getVoices();

        function logToTerminal(sender, message) {
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            if (sender === 'USER') {
                entry.innerHTML = `<span class="log-user">USER:</span> ${message}`;
            } else if (sender === 'CHITTI') {
                entry.innerHTML = `<span class="log-ai">CHITTI:</span> ${message}`;
            } else if (sender === 'SYS_ERR') {
                entry.innerHTML = `<span class="log-error">> SYS_ERROR: ${message}</span>`;
            } else {
                entry.innerHTML = `> ${message}`;
            }
            terminalBox.appendChild(entry);
            terminalBox.scrollTop = terminalBox.scrollHeight;
        }

        function setUIState(state) {
            coreEl.className = `core-container ${state}`;
            if (state === 'passive') {
                coreText.innerText = "SLP";
                statusText.innerText = "STATUS: PASSIVE RADAR (AWAITING WAKE WORD)";
            } else if(state === 'listening') {
                coreText.innerText = "REC";
                statusText.innerText = "STATUS: ACTIVE LISTENING";
            } else if (state === 'thinking') {
                coreText.innerText = "PRC";
                statusText.innerText = "STATUS: PROCESSING";
            } else if (state === 'speaking') {
                coreText.innerText = "OUT";
                statusText.innerText = "STATUS: TRANSMITTING";
            }
        }

        recognition.onstart = () => {
            if (aiIsSpeaking) {
                recognition.stop();
                return;
            }
            if (!isAwake) {
                setUIState('passive');
            } else {
                setUIState('listening');
            }
        };

        // 2. The Wake Word Engine Logic
        recognition.onresult = async (event) => {
            const userCommand = event.results[0][0].transcript.toLowerCase();
            
            if (!isAwake) {
                // If she hears her name, wake up immediately!
                if (userCommand.includes("chitti") || userCommand.includes("city")) {
                    isAwake = true; // Switch state
                    logToTerminal('USER', "[ WAKE WORD DETECTED ]");
                    // Speak her greeting, the 'true' flag means listen for command immediately after
                    speakReply("Yes boss? Tell me.", true);
                }
            } else {
                // She was already awake, so this is your command!
                isAwake = false; // Go back to sleep state after command is taken
                logToTerminal('USER', userCommand);
                await processWithChitti(userCommand);
            }
        };

        // 3. The Auto-Loop (Never Stops)
        recognition.onend = () => {
            if (radarActive && !aiIsSpeaking) {
                try { recognition.start(); } catch(e) {}
            }
        };

        recognition.onerror = (e) => {
            if (e.error !== "no-speech") {
                console.log("Mic Error:", e.error);
            }
        };

        function startRadarLoop() {
            if (!API_KEY) { askForKey(); return; }
            radarActive = true;
            isAwake = false;
            logToTerminal('SYS', "Radar loop active. Say 'Chitti' to wake her up.");
            try { recognition.start(); } catch(e) {}
        }

        async function processWithChitti(promptText) {
            setUIState('thinking');

            try {
                // Pointing to the absolute newest Gemini 3.7 model
                const fetchUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.7-flash:generateContent`;
                
                const response = await fetch(fetchUrl, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'x-goog-api-key': API_KEY
                    }, 
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptText }] }],
                        systemInstruction: { parts: [{ text: systemInstruction }] }
                    })
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData?.error?.message || `HTTP ${response.status} - Request Denied`);
                }

                const data = await response.json();
                const aiReply = data.candidates[0].content.parts[0].text;
                
                logToTerminal('CHITTI', aiReply);
                
                // Speak reply, the 'false' flag means go back to sleep/radar mode after
                speakReply(aiReply, false);

            } catch (err) {
                logToTerminal('SYS_ERR', err.message);
                setUIState('passive');
            }
        }

        // 4. Smooth Human-Like Voice Injection
        function speakReply(text, expectCommandAfter) {
            aiIsSpeaking = true;
            try { recognition.stop(); } catch(e) {} // Mute the mic so she doesn't hear herself talk
            
            setUIState('speaking');
            const utterance = new SpeechSynthesisUtterance(text);
            
            // Tweak the vocal cords to sound less robotic
            utterance.rate = 1.05; 
            utterance.pitch = 1.1;

            const voices = window.speechSynthesis.getVoices();
            
            // Force the browser to hunt for premium Google network voices instead of local robotic ones
            let bestVoice = voices.find(v => (v.name.includes('Google') || v.name.includes('Online')) && (v.lang.includes('hi') || v.lang.includes('IN')));
            if (!bestVoice) bestVoice = voices.find(v => v.name.includes('Google') && v.lang.includes('GB'));
            if (!bestVoice) bestVoice = voices.find(v => v.lang.includes('en-IN') || v.lang.includes('hi'));
            
            if (bestVoice) utterance.voice = bestVoice;

            // When she finishes speaking...
            utterance.onend = () => {
                aiIsSpeaking = false;
                if (expectCommandAfter) {
                    // Start mic instantly in Active Command mode
                    isAwake = true;
                    setUIState('listening');
                    try { recognition.start(); } catch(e) {}
                } else {
                    // Start mic quietly in Passive Radar mode
                    isAwake = false;
                    setUIState('passive');
                    try { recognition.start(); } catch(e) {}
                }
            };
            
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
